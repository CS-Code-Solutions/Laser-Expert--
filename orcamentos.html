<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <!-- Firebase SDKs Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Inicialização e Sincronização do Firebase -->
  <script src="firebase-init.js"></script>
  <script src="firebase-sync.js"></script>
  <script>
    if (localStorage.getItem('rg_logged') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>

  <link rel="icon" href="ico.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laser Expert - Histórico de Relatórios (RS)</title>
  <link rel="stylesheet" href="style.css">
  <!-- html2pdf CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @media print {
      header, footer, .no-print { display: none !important; }
      body { background: white; color: black; padding: 0; margin: 0; }
      .card { box-shadow: none; border: none; padding: 0; margin: 0; }
    }

    .watermark {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 85px; font-weight: bold;
      color: rgba(0, 245, 212, 0.025);
      z-index: 0; pointer-events: none;
      text-align: center; white-space: nowrap; text-transform: uppercase; width: 100%;
    }

    .print-body { font-family: Arial, sans-serif; color: #0B132B; line-height: 1.4; font-size: 11px; position: relative; z-index: 1; box-sizing: border-box; width: 100%; }
    .print-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00F5D4; padding-bottom: 8px; margin-bottom: 12px; }
    .print-header img { height: 45px; width: auto; }
    .print-header-info { text-align: right; }
    .print-header-info h1 { font-size: 14px; color: #0B132B; margin: 0; font-weight: bold; }
    .section-box { border: 1px solid #CBD5E1; padding: 10px; margin-bottom: 10px; border-radius: 6px; background: #F8FAFC; page-break-inside: avoid; }
    .section-title { font-weight: bold; font-size: 12px; color: #0B132B; margin-bottom: 6px; border-bottom: 1px solid #E2E8F0; padding-bottom: 3px; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    .print-body p { margin: 2px 0; }
  </style>
</head>
<body>

  <header class="no-print">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="Logo">
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Clientes</a></li>
          <li><a href="maquinas.html">Máquinas</a></li>
          <li><a href="novo-relatorio.html">Novo Relatório</a></li>
          <li><a href="historico.html" class="active">Histórico RS</a></li>
          <li><a href="orcamentos.html">Orçamentos</a></li>
          <li><a href="configuracao.html">Configuração</a></li>
          <li><a href="login.html" onclick="localStorage.removeItem('rg_logged')" style="color: var(--danger); font-weight: bold;">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Histórico de Relatórios de Serviço (RS)</h2>
      <div id="reportsContainer" style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
        <p style="text-align: center; color: #64748B;">A carregar relatórios da nuvem...</p>
      </div>
    </section>
  </main>

  <footer class="no-print">
    <p>&copy; 2026 Laser Expert — Todos os direitos reservados. | Powered by <strong>CS Code Solutions</strong></p>
  </footer>

  <script>
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function renderReports() {
      const container = document.getElementById('reportsContainer');
      if (!container) return;

      try {
        let reports = await DataSync.load('rg_reports') || [];
        if (!Array.isArray(reports)) reports = [];

        container.innerHTML = '';
        if (reports.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: #64748B;">Nenhum relatório registado.</p>';
          return;
        }

        let htmlCards = '';
        for (let i = reports.length - 1; i >= 0; i--) {
          const r = reports[i];
          if (!r) continue;

          const safeNum = escapeHTML(r.number || 'RS-0001');
          const safeDate = escapeHTML(r.date || '-');
          const safeClient = escapeHTML(r.client || '-');
          const safeEq = escapeHTML(r.equipment || '-');
          const safeType = escapeHTML(r.type || 'Corretiva');

          htmlCards += `
            <div style="border: 1px solid #CBD5E1; padding: 15px; border-radius: 6px; background: #F8FAFC; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px;">
              <div style="flex: 1; min-width: 220px;">
                <strong style="font-size: 1.05rem; color: #0B132B;">${safeNum}</strong> — <span style="color: #64748B; font-size: 0.9rem;">${safeDate}</span><br>
                <span style="font-size: 0.9rem; color: #334155;"><strong>Cliente:</strong> ${safeClient}</span><br>
                <span style="font-size: 0.9rem; color: #334155;"><strong>Equipamento:</strong> ${safeEq}</span><br>
                <span style="font-size: 0.9rem; color: #0D9488;"><strong>Tipo:</strong> ${safeType}</span>
              </div>
              <div class="no-print" style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
                <button class="btn" style="padding: 6px 12px; font-size: 0.85rem; background-color: #1D4ED8;" onclick="gerarECompartilharRS(${i})">Gerar RS</button>
                <button class="btn" style="padding: 6px 12px; font-size: 0.85rem; background-color: #F59E0B;" onclick="editReport(${i})">Editar</button>
                <button class="btn" style="padding: 6px 12px; font-size: 0.85rem; background-color: #EF4444;" onclick="deleteReport(${i})">Excluir</button>
              </div>
            </div>
          `;
        }
        container.innerHTML = htmlCards;
      } catch (err) {
        container.innerHTML = `<p style="text-align: center; color: red;">Erro ao carregar relatórios.</p>`;
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await renderReports();
      DataSync.listen('rg_reports', () => renderReports());
    });

    window.editReport = function(index) {
      localStorage.setItem('edit_report_index', index);
      window.location.href = 'novo-relatorio.html';
    };

    window.deleteReport = async function(index) {
      if (confirm('Deseja realmente excluir este relatório?')) {
        try {
          let reports = await DataSync.load('rg_reports') || [];
          reports.splice(index, 1);
          await DataSync.save('rg_reports', reports);
          renderReports();
        } catch (e) {
          alert('Erro ao excluir relatório.');
        }
      }
    };

    function waitForImages(container) {
      const imgs = container.querySelectorAll('img');
      const promises = Array.from(imgs).map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve;
        });
      });
      return Promise.all(promises);
    }

    window.gerarECompartilharRS = async function(index) {
      let reports = await DataSync.load('rg_reports') || [];
      const r = reports[index];
      if (!r) { alert("Relatório não encontrado."); return; }

      const defaultConfig = { 
        name: 'LASER EXPERT SERVICO E COMERCIO DE PECAS LTDA', 
        tech: 'Otávio Barbosa',
        doc: '48.959.536/0001-65',
        email: 'comercial@laserexpertbr.com.br',
        contact: '+55 51 98144-1865',
        location: 'Rua Corte Real 487 – Scharlau – São Leopoldo – RS',
        techSignature: ''
      };

      let config = { ...defaultConfig };
      try {
        const savedCfg = await DataSync.load('rg_config');
        if (savedCfg) config = { ...defaultConfig, ...savedCfg };
      } catch (e) {}

      let clients = await DataSync.load('rg_clients') || [];
      const clientObj = clients.find(c => c.name === r.client) || {};

      const techSignature = config.techSignature || '';
      const signatureAreaHtml = `
        <div style="margin-top: 15px; display: flex; justify-content: center; page-break-inside: avoid;">
          <div style="text-align: center; width: 60%;">
            ${techSignature ? `<img src="${techSignature}" alt="Assinatura Técnico" style="max-width: 180px; height: 50px; object-fit: contain; display: block; margin: 0 auto;">` : '<div style="height: 50px;"></div>'}
            <p style="margin: 2px 0;">________________________________________</p>
            <p style="margin: 2px 0; font-size: 10px;"><strong>Responsável Técnico / Emissor:</strong> ${escapeHTML(config.tech || 'Otávio Barbosa')}</p>
          </div>
        </div>
      `;

      const tempContainer = document.createElement('div');
      tempContainer.style.position = 'fixed';
      tempContainer.style.top = '0';
      tempContainer.style.left = '0';
      tempContainer.style.width = '794px';
      tempContainer.style.opacity = '0';
      tempContainer.style.pointerEvents = 'none';
      tempContainer.style.zIndex = '-9999';

      tempContainer.innerHTML = `
        <div class="print-body" style="background: white; padding: 20px;">
          <div class="watermark">RELATÓRIO RS</div>

          <div class="print-header">
            <img src="logo.png" alt="Logo">
            <div class="print-header-info">
              <h1>RELATÓRIO DE SERVIÇO (RS)</h1>
              <p><strong>Nº:</strong> ${escapeHTML(r.number)} | <strong>Data:</strong> ${escapeHTML(r.date)}</p>
            </div>
          </div>

          <div class="section-box">
            <div class="section-title">DADOS DA EMPRESA</div>
            <p><strong>Razão Social:</strong> ${escapeHTML(config.name)}</p>
            <p><strong>CNPJ:</strong> ${escapeHTML(config.doc)}</p>
            <p><strong>Contato:</strong> ${escapeHTML(config.contact)} | <strong>E-mail:</strong> ${escapeHTML(config.email)}</p>
            <p><strong>Endereço:</strong> ${escapeHTML(config.location)}</p>
          </div>

          <div class="section-box">
            <div class="section-title">CLIENTE & EQUIPAMENTO</div>
            <div class="grid-2">
              <div>
                <p><strong>Cliente:</strong> ${escapeHTML(r.client)}</p>
                <p><strong>E-mail:</strong> ${escapeHTML(clientObj.email || '-')}</p>
                <p><strong>CNPJ/CPF:</strong> ${escapeHTML(clientObj.doc || clientObj.cnpj || '-')}</p>
              </div>
              <div>
                <p><strong>Equipamento:</strong> ${escapeHTML(r.equipment || '-')}</p>
                <p><strong>Tipo de Atendimento:</strong> ${escapeHTML(r.type || 'Corretiva')}</p>
                <p><strong>Endereço:</strong> ${escapeHTML(clientObj.address || '-')}</p>
              </div>
            </div>
          </div>

          <div class="section-box">
            <div class="section-title">DESCRIÇÃO DOS SERVIÇOS & DIAGNÓSTICO</div>
            <p style="white-space: pre-wrap; font-size: 11.5px; padding: 4px 0;">${escapeHTML(r.desc || 'Nenhum detalhe informado.')}</p>
          </div>

          ${signatureAreaHtml}
        </div>
      `;
      document.body.appendChild(tempContainer);

      await waitForImages(tempContainer);
      await new Promise(resolve => setTimeout(resolve, 300));

      const filename = `Relatorio_${escapeHTML(r.number)}_${escapeHTML(r.client).replace(/[^a-zA-Z0-9]/g, '_')}.pdf`;
      const opt = {
        margin:       5,
        filename:     filename,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 1.5, useCORS: true, logging: false },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      try {
        const worker = html2pdf().from(tempContainer).set(opt);
        const pdfBlob = await worker.outputPdf('blob');
        const pdfFile = new File([pdfBlob], filename, { type: 'application/pdf' });
        document.body.removeChild(tempContainer);

        if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
          await navigator.share({
            title: `Relatório ${r.number}`,
            text: `Segue o Relatório de Serviço ${r.number} (${r.client}).`,
            files: [pdfFile]
          });
        } else {
          worker.save();
          alert("O PDF foi gerado e descarregado com sucesso.");
        }
      } catch (err) {
        if (document.body.contains(tempContainer)) document.body.removeChild(tempContainer);
        console.error(err);
        alert("Erro ao gerar o PDF: " + err.message);
      }
    };
  </script>
</body>
</html>
